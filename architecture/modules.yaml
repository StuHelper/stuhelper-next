applications:
  - id: backend
    repository: StuHelper/stuhelper-backend
    visibility: private
    implementation: framework
    specifications:
      - docs/spec/module-lifecycle.md
      - docs/spec/sso-compatibility.md
  - id: web
    repository: StuHelper/stuhelper-web
    visibility: public
    implementation: framework
    optional: [storage, storage-contribution]
    capability_requires:
      storage.custody: [storage]
      contributions.manage: [storage-contribution]
    specifications:
      - docs/spec/internationalization.md
      - docs/spec/storage-contribution.md
    scenario_tests:
      ST-10:
        - tests/e2e/custody.spec.mjs#custody requires consent, clears secrets and preserves the binding on renewal
        - tests/e2e/custody.spec.mjs#uncertain custody submission recovers by ID without retaining or resending a password
        - tests/e2e/custody.spec.mjs#an existing blocked custody request resumes without new credentials
      ST-01:
        - tests/e2e/contributions.spec.mjs#consent, creation, quota adjustment and renewal retain distinct request state
      ST-03:
        - tests/e2e/contributions.spec.mjs#exit remains pending while replicas remain
      ST-08:
        - tests/e2e/contributions.spec.mjs#lost response retries original mutation, paginates and clears revoked data
  - id: admin
    repository: StuHelper/stuhelper-admin
    visibility: public
    implementation: framework
    optional: [storage, storage-contribution]
    capability_requires:
      storage.operations: [storage]
      storage.custody.operations: [storage]
      contributions.operations: [storage-contribution]
    specifications:
      - docs/spec/internationalization.md
      - docs/spec/admin-operations.md
      - docs/spec/storage-placement.md
      - docs/spec/storage-contribution.md
    scenario_tests:
      ST-11:
        - tests/e2e/custody.spec.mjs#custody administration resumes original consent without credential access
        - tests/e2e/custody.spec.mjs#custody administration handles unauthenticated and empty states
      ST-09:
        - tests/e2e/contributions.spec.mjs#operator retry preserves conditions, retains uncertain request and clears revoked inventory
        - tests/e2e/contributions.spec.mjs#operator login boundary recovers to an empty page
operations:
  - id: ops
    repository: StuHelper/stuhelper-ops
    visibility: private
    kind: operations
    specifications:
      - docs/spec/ci-runners.md
      - docs/spec/admin-operations.md
      - docs/spec/sso-compatibility.md
    scenario_tests:
      CI-16:
        - scripts/registry-probe.test.mjs#registry probes are confined to unique temporary tags in Next application repositories
        - scripts/registry-probe.test.mjs#manifest deletion uses a digest verified against the returned bytes
        - scripts/registry-probe.test.mjs#interruption during asynchronous cleanup waits for the same cleanup before exit
        - scripts/registry-probe.test.mjs#interruption stops active work before removing its Registry resources
        - scripts/registry-probe.test.mjs#cancelled builds exit before Registry cleanup begins
shared_specifications:
  - docs/spec/terminology.md
  - docs/spec/native-clients.md
