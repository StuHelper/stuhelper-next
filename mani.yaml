# Developer checkout. Integration inputs are recorded in workspace.lock.json.
shell: bash
sync_gitignore: false
sync_remotes: false
remove_orphaned_worktrees: false

projects:
  platform:
    path: workspace/platform
    url: https://github.com/StuHelper/stuhelper-platform.git
    branch: develop
    tags: [backend, code]
  web:
    path: workspace/web
    url: https://github.com/StuHelper/stuhelper-web.git
    branch: develop
    tags: [frontend, code]
  admin:
    path: workspace/admin
    url: https://github.com/StuHelper/stuhelper-admin.git
    branch: develop
    tags: [frontend, code]

  sso:
    path: workspace/sso
    url: https://github.com/StuHelper/stuhelper-sso.git
    branch: develop
    tags: [documents]
  verification:
    path: workspace/verification
    url: https://github.com/StuHelper/stuhelper-verification.git
    branch: develop
    tags: [documents]
  campus-adapters:
    path: workspace/campus-adapters
    url: https://github.com/StuHelper/stuhelper-campus-adapters.git
    branch: develop
    tags: [documents]
  billing:
    path: workspace/billing
    url: https://github.com/StuHelper/stuhelper-billing.git
    branch: develop
    tags: [documents]
  ops:
    path: workspace/ops
    url: https://github.com/StuHelper/stuhelper-ops.git
    branch: develop
    tags: [documents]

specs:
  default:
    parallel: false
    forks: 3
    ignore_errors: false
    ignore_non_existing: false

tasks:
  status:
    desc: Show each repository's branch and working tree
    cmd: git status --short --branch
  fetch:
    desc: Fetch remote refs without switching branches or changing files
    cmd: git fetch origin --tags
  setup:
    desc: Install each code repository's locked tools
    cmd: make setup
    target:
      tags: [code]
  check:
    desc: Run each code repository's own checks
    cmd: make check
    target:
      tags: [code]
  build:
    desc: Build each code repository independently
    cmd: make build
    target:
      tags: [code]

