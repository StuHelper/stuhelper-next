name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for this trusted branch check
        type: choice
        options:
          - github
          - stuhelper
        default: github
        required: true
      combination:
        description: Integration source selection
        type: choice
        options:
          - latest
          - fixed
        default: latest
        required: true
      candidates:
        description: Optional paired candidates as a JSON object
        type: string
        default: "{}"
        required: false
      replay:
        description: Exact integration record copied from a previous summary
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository validation
    # PRs always use GitHub-hosted compute in this maintained workflow.
    # Ordinary checks only. Image builds and BJ1 Registry jobs must use ARC.
    # See docs/spec/ci-runners.md for the organization-level access boundary.
    runs-on: >-
      ${{ fromJSON(
        (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'stuhelper') ||
         (github.event_name == 'push' && vars.CI_RUNNER == 'stuhelper')) &&
        '{"group":"stuhelper-arc","labels":"stuhelper-arc-sh-k8s"}' ||
        '"ubuntu-26.04"') }}
    timeout-minutes: 10
    outputs:
      integration: ${{ steps.changes.outputs.integration }}
      candidates: ${{ steps.candidates.outputs.candidates }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify runner request
        env:
          REQUESTED_RUNNER: ${{ inputs.runner }}
        shell: bash
        run: |
          if [[ "$REQUESTED_RUNNER" == stuhelper && "$GITHUB_REF" != refs/heads/develop && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'StuHelper runners are restricted to develop/main dispatches.' >&2
            exit 1
          fi
          python3 --version
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up the declared pnpm version
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: false
      - name: Set up Go for pinned tools
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.12.18
          enable-cache: false
      - name: Configure task-owned dependency directories
        id: cache-env
        shell: bash
        run: |
          echo "PNPM_HOME=$RUNNER_TEMP/next-repository/pnpm" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/next-repository/uv" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/next-repository/gomod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/next-repository/go-build" >> "$GITHUB_ENV"
          source /etc/os-release
          echo "platform=$ID-$VERSION_ID-py$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" >> "$GITHUB_OUTPUT"
      - name: Restore public repository dependencies
        id: repository-cache
        uses: actions/cache/restore@v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/next-repository
          key: next-repository-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ steps.cache-env.outputs.platform }}-${{ hashFiles('architecture/toolchains.json', '.node-version', '.go-version', 'pnpm-lock.yaml', 'uv.lock') }}
      - name: Install locked tools
        run: make setup
      - name: Run repository checks
        env:
          GOWORK: off
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: make check

      - name: Select integration from the complete PR diff
        id: changes
        run: node scripts/workspace.mjs affected
      - name: Read paired integration candidates
        id: candidates
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tooling/cli.mjs integration-inputs
      - name: Bound repository cache upload
        id: repository-size
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && steps.repository-cache.outputs.cache-hit != 'true'
        run: node scripts/ci-cache.mjs "$RUNNER_TEMP/next-repository" 1024
      - name: Save successful repository dependencies
        if: steps.repository-size.outputs.save == 'true'
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/next-repository
          key: ${{ steps.repository-cache.outputs.cache-primary-key }}

  integration:
    name: Cross-repository checks
    needs: repository
    if: needs.repository.outputs.integration == 'true'
    uses: ./.github/workflows/integration.yml
    with:
      source: ${{ inputs.combination || 'latest' }}
      candidate_repository: ${{ github.repository }}
      candidate_revision: ${{ github.sha }}
      candidates: ${{ inputs.candidates || needs.repository.outputs.candidates || '{}' }}
      replay: ${{ inputs.replay || '' }}
      coordinator_ref: ${{ github.sha }}
      enabled: ${{ needs.repository.outputs.integration == 'true' }}

  required:
    name: Repository checks
    needs: [repository, integration]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require every selected check to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          INTEGRATION_SELECTED: ${{ needs.repository.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        shell: bash
        run: |
          test "$REPOSITORY_RESULT" = success
          case "$INTEGRATION_SELECTED:$INTEGRATION_RESULT" in
            true:success) echo 'Repository and framework integration passed.' ;;
            false:skipped) echo 'Repository passed; documentation-only integration was not selected.' ;;
            *) echo 'A required check failed, was cancelled, or did not run.' >&2; exit 1 ;;
          esac
