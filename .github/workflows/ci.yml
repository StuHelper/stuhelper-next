name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for this trusted branch check
        type: choice
        options: [github, stuhelper]
        default: github
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.runner || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository checks
    # PRs always use GitHub-hosted compute in this maintained workflow.
    # Ordinary checks only. Image builds and BJ1 Registry jobs must use ARC.
    # See docs/spec/ci-runners.md for the organization-level access boundary.
    runs-on: >-
      ${{ fromJSON(
        (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'stuhelper') ||
         (github.event_name == 'push' && vars.CI_RUNNER == 'stuhelper')) &&
        '{"group":"stuhelper-arc","labels":"stuhelper-arc-sh-k8s"}' ||
        '"ubuntu-26.04"') }}
    timeout-minutes: 10
    outputs:
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify runner request
        env:
          REQUESTED_RUNNER: ${{ inputs.runner }}
        shell: bash
        run: |
          if [[ "$REQUESTED_RUNNER" == stuhelper && "$GITHUB_REF" != refs/heads/develop && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'StuHelper runners are restricted to develop/main dispatches.' >&2
            exit 1
          fi
          python3 --version

      - name: Validate repository
        run: |
          python3 scripts/check.py
          python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Set up Node.js for documentation
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install locked documentation tools
        run: npm ci --ignore-scripts

      - name: Check documentation and checker regressions
        run: |
          npm run check:docs
          npm run test:docs
          node scripts/workspace.mjs validate
          node --test scripts/workspace.test.mjs

      - name: Set up uv for documentation build
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.12.18'
          enable-cache: false

      - name: Build documentation strictly
        run: uv run --locked mkdocs build --strict

      - name: Validate GitHub Actions workflows
        run: python3 scripts/lint_workflows.py

      - name: Select integration scope
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            echo 'integration=true' >> "$GITHUB_OUTPUT"
          else
            result=$(node scripts/workspace.mjs affected "$BASE_REF")
            echo "integration=$result" >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: Framework integration
    needs: repository
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Record documentation-only scope
        if: needs.repository.outputs.integration != 'true'
        run: echo 'Framework integration is not applicable to this documentation-only change.'
      - uses: actions/checkout@v7.0.1
        if: needs.repository.outputs.integration == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        if: needs.repository.outputs.integration == 'true'
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@v7.1.0
        if: needs.repository.outputs.integration == 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install integration tools
        if: needs.repository.outputs.integration == 'true'
        run: |
          npm install --global corepack@0.34.5
          npm ci --ignore-scripts
          GOBIN="$RUNNER_TEMP/bin" GOWORK=off go install github.com/alajmo/mani@v0.32.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check out the recorded source combination
        if: needs.repository.outputs.integration == 'true'
        run: |
          node scripts/workspace.mjs checkout
          mani run setup --tags code
      - name: Check repositories, toolchains and compatible contracts
        if: needs.repository.outputs.integration == 'true'
        run: |
          mani run check --tags code
          node scripts/workspace.mjs toolchains
          node scripts/workspace.mjs contracts
      - name: Install browser
        if: needs.repository.outputs.integration == 'true'
        run: npx playwright install --with-deps chromium
      - name: Exercise all supported languages against the framework
        if: needs.repository.outputs.integration == 'true'
        run: npm run test:e2e
