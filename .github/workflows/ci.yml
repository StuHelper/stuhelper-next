name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for this trusted branch check
        type: choice
        options: [ github, stuhelper ]
        default: github
        required: true
      combination:
        description: Integration source selection
        type: choice
        options:
          - fixed
          - latest
        default: fixed
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.runner || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository checks
    # PRs always use GitHub-hosted compute in this maintained workflow.
    # Ordinary checks only. Image builds and BJ1 Registry jobs must use ARC.
    # See docs/spec/ci-runners.md for the organization-level access boundary.
    runs-on: >-
      ${{ fromJSON(
        (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
        ((github.event_name == 'workflow_dispatch' && inputs.runner == 'stuhelper') ||
         (github.event_name == 'push' && vars.CI_RUNNER == 'stuhelper')) &&
        '{"group":"stuhelper-arc","labels":"stuhelper-arc-sh-k8s"}' ||
        '"ubuntu-26.04"') }}
    timeout-minutes: 10
    outputs:
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify runner request
        env:
          REQUESTED_RUNNER: ${{ inputs.runner }}
        shell: bash
        run: |
          if [[ "$REQUESTED_RUNNER" == stuhelper && "$GITHUB_REF" != refs/heads/develop && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'StuHelper runners are restricted to develop/main dispatches.' >&2
            exit 1
          fi
          python3 --version
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up the declared pnpm version
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: false
      - name: Set up Go for pinned tools
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.12.18
          enable-cache: false
      - name: Install locked tools
        run: make setup
      - name: Run repository checks
        env:
          GOWORK: off
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: make check

      - name: Select integration scope
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            echo 'integration=true' >> "$GITHUB_OUTPUT"
          else
            result=$(node scripts/workspace.mjs affected "$BASE_REF")
            echo "integration=$result" >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: Framework integration
    needs: repository
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Record documentation-only scope
        if: needs.repository.outputs.integration != 'true'
        run: echo 'Framework integration is not applicable to this documentation-only change.'
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
        if: needs.repository.outputs.integration == 'true'
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
        if: needs.repository.outputs.integration == 'true'
      - name: Set up the declared pnpm version
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: false
        if: needs.repository.outputs.integration == 'true'
      - name: Set up Go for pinned tools
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
        if: needs.repository.outputs.integration == 'true'
      - name: Install integration tools
        if: needs.repository.outputs.integration == 'true'
        run: |
          pnpm install --frozen-lockfile
          GOBIN="$RUNNER_TEMP/bin" GOWORK=off go install github.com/alajmo/mani@v0.32.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Resolve and check out the integration combination
        if: needs.repository.outputs.integration == 'true'
        env:
          INTEGRATION_SOURCE: ${{ inputs.combination || 'fixed' }}
        run: |
          if [[ "$INTEGRATION_SOURCE" == latest ]]; then
            node scripts/workspace.mjs checkout --latest
          else
            node scripts/workspace.mjs checkout
          fi
          mani run setup --tags code
      - name: Check repositories, toolchains and contracts
        if: needs.repository.outputs.integration == 'true'
        run: |
          mani run check --tags code
          node scripts/workspace.mjs toolchains
          node scripts/workspace.mjs contracts
      - name: Install browser
        if: needs.repository.outputs.integration == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise all supported languages
        if: needs.repository.outputs.integration == 'true'
        run: pnpm run test:e2e
