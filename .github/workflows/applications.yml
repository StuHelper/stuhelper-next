name: Public application integration
on:
  pull_request:
    branches: [develop, main]
    paths: [architecture/**, scripts/workspace*, tests/e2e/**, playwright.config.mjs, .github/workflows/applications.yml]
  push:
    branches: [develop, main]
    paths: [architecture/**, scripts/workspace*, tests/e2e/**, playwright.config.mjs, .github/workflows/applications.yml]
  workflow_dispatch:
    inputs:
      platform_commit:
        description: Full candidate SHA, or empty for develop
        type: string
      web_commit:
        description: Full candidate SHA, or empty for develop
        type: string
      admin_commit:
        description: Full candidate SHA, or empty for develop
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  applications:
    name: Public application integration
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      LEFTHOOK: '0'
      GOWORK: 'off'
    steps:
      - name: Validate explicit candidates
        env:
          PLATFORM: ${{ inputs.platform_commit }}
          WEB: ${{ inputs.web_commit }}
          ADMIN: ${{ inputs.admin_commit }}
        run: |
          for revision in "$PLATFORM" "$WEB" "$ADMIN"; do
            [[ -z "$revision" || "$revision" =~ ^[a-f0-9]{40}$ ]] || exit 1
          done
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-platform
          ref: ${{ inputs.platform_commit || 'develop' }}
          path: workspace/platform
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-web
          ref: ${{ inputs.web_commit || 'develop' }}
          path: workspace/web
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-admin
          ref: ${{ inputs.admin_commit || 'develop' }}
          path: workspace/admin
          persist-credentials: false
      - uses: StuHelper/stuhelper-tooling/actions/setup@v0.1.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Record actual source combination
        run: |
          pnpm install --frozen-lockfile
          node scripts/workspace.mjs snapshot
          node scripts/workspace.mjs toolchains
          node scripts/workspace.mjs contracts
      - name: Build public example and clients
        run: |
          (cd workspace/platform && go build -mod=readonly -o bin/stuhelper-platform ./examples/server)
          pnpm --dir workspace/web install --frozen-lockfile
          pnpm --dir workspace/web run build
          pnpm --dir workspace/admin install --frozen-lockfile
          pnpm --dir workspace/admin run setup
          pnpm --dir workspace/admin run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
